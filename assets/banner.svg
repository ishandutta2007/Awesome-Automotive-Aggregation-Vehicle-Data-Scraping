<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: #334155;
        stroke-opacity: 0.15;
        stroke-width: 1;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .pulse-circle-rev {
        animation: pulseRev 5s ease-in-out infinite alternate;
      }
      .stream-flow {
        stroke-dasharray: 12 180;
        animation: dashStream 7s linear infinite;
      }
      .stream-flow-2 {
        stroke-dasharray: 18 220;
        animation: dashStream2 9s linear infinite;
      }
      .node-pulse {
        animation: beacon 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.65; }
      }
      @keyframes pulseRev {
        0% { transform: scale(1.1) translate(15px, -10px); opacity: 0.3; }
        100% { transform: scale(0.95) translate(-10px, 10px); opacity: 0.6; }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dashStream2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1000; }
      }
      @keyframes beacon {
        0%, 100% { opacity: 0.3; r: 4; }
        50% { opacity: 0.9; r: 7; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Depth layer) -->
  <g filter="url(#softGlow)">
    <circle cx="150" cy="90" r="120" fill="#0284c7" class="pulse-circle" />
    <circle cx="1060" cy="330" r="140" fill="#7c3aed" class="pulse-circle-rev" />
    <circle cx="980" cy="70" r="90" fill="#06b6d4" class="pulse-circle" />
    <circle cx="200" cy="360" r="110" fill="#4338ca" class="pulse-circle-rev" />
  </g>

  <!-- High-Tech Coordinate Grid -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Dynamic Vehicle Data Network Streams (Background Animation) -->
  <g fill="none">
    <path d="M 40,320 Q 300,100 600,260 T 1160,110" stroke="#0ea5e9" stroke-width="2.5" opacity="0.3" />
    <path d="M 40,320 Q 300,100 600,260 T 1160,110" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" class="stream-flow" filter="url(#glowFilter)" />
    
    <path d="M 40,110 Q 350,340 700,160 T 1160,330" stroke="#8b5cf6" stroke-width="2" opacity="0.25" />
    <path d="M 40,110 Q 350,340 700,160 T 1160,330" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" class="stream-flow-2" filter="url(#glowFilter)" />
    
    <!-- Pulse Data Nodes along paths -->
    <circle cx="300" cy="190" fill="#38bdf8" class="node-pulse" filter="url(#glowFilter)" />
    <circle cx="600" cy="260" fill="#818cf8" class="node-pulse" filter="url(#glowFilter)" />
    <circle cx="920" cy="180" fill="#c084fc" class="node-pulse" filter="url(#glowFilter)" />
  </g>

  <!-- Glowing Accent Border Lines -->
  <line x1="60" y1="2" x2="1140" y2="2" stroke="url(#glowLineGrad)" stroke-width="3" filter="url(#glowFilter)" />
  <line x1="150" y1="418" x2="1050" y2="418" stroke="url(#glowLineGrad)" stroke-width="2.5" filter="url(#glowFilter)" />

  <!-- Center Content Plate (Solid contrast protection for clear foreground readability) -->
  <rect x="120" y="45" width="960" height="330" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Car Silhouette / Speed Line Iconography (Clean Tech Aesthetic) -->
  <g transform="translate(560, 65) scale(0.75)" opacity="0.9" filter="url(#glowFilter)">
    <path d="M 10 32 C 22 20, 38 12, 58 10 L 82 10 C 104 10, 118 18, 126 28 L 148 30 C 160 30, 168 36, 172 44 L 176 52 C 176 54, 172 55, 168 55 L 158 55 C 154 47, 146 42, 136 42 C 126 42, 118 47, 114 55 L 42 55 C 38 47, 30 42, 20 42 C 10 42, 2 47, -2 55 L -14 55 C -18 55, -22 52, -20 48 L -14 38 C -10 33, 0 32, 10 32 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="136" cy="55" r="7" fill="#818cf8" />
    <circle cx="20" cy="55" r="7" fill="#818cf8" />
    <line x1="-40" y1="42" x2="-22" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="-55" y1="48" x2="-25" y2="48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND TEXT (Protected from animation overlap) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <rect x="445" y="68" width="310" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2" />
    <text x="600" y="87" fill="#7dd3fc" text-anchor="middle" class="badge-text">⚡ CURATED AUTOMOTIVE INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="600" y="152" fill="url(#titleGrad)" text-anchor="middle" class="title-text" font-size="37" filter="url(#glowFilter)">
      Automotive Aggregation &amp; Vehicle Data
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" fill="#f8fafc" text-anchor="middle" class="sub-text" font-size="20">
      Enterprise SaaS Platforms, Auction Trackers &amp; Open-Source Scraping Pipelines
    </text>

    <!-- Tagline description -->
    <text x="600" y="232" fill="#94a3b8" text-anchor="middle" class="sub-text" font-size="14.5">
      Comprehensive Directory for Dealership Inventory Mining, VIN Decoding (NHTSA vPIC) &amp; Pricing Telemetry
    </text>

    <!-- Interactive / Feature Badges in Foreground -->
    <g transform="translate(195, 272)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="20" cy="21" r="5" fill="#38bdf8" />
        <text x="34" y="26" fill="#e2e8f0" class="badge-text">Marketplaces &amp; SaaS</text>
      </g>
      
      <!-- Pill 2 -->
      <g transform="translate(205, 0)">
        <rect width="190" height="42" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="20" cy="21" r="5" fill="#818cf8" />
        <text x="34" y="26" fill="#e2e8f0" class="badge-text">VIN Decoding (vPIC)</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(420, 0)">
        <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="20" cy="21" r="5" fill="#a855f7" />
        <text x="34" y="26" fill="#e2e8f0" class="badge-text">Dealer Inventory Bots</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(630, 0)">
        <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="20" cy="21" r="5" fill="#ec4899" />
        <text x="34" y="26" fill="#e2e8f0" class="badge-text">Auction &amp; Price Feeds</text>
      </g>
    </g>

    <!-- Bottom Metric Highlight line -->
    <text x="600" y="352" fill="#64748b" text-anchor="middle" class="badge-text" font-size="12">
      TOP-RANKED OPEN-SOURCE TOOLS • HEADLESS BROWSER CRAWLERS • ENTERPRISE VALUATIONS
    </text>
  </g>
</svg>
